workflows:
  android-debug-apk:
    name: Android Debug APK
    max_build_duration: 60
    environment:
      java: 17
    scripts:
      - name: Show Android build environment
        script: |
          java -version
          gradle --version
          echo "ANDROID_HOME=$ANDROID_HOME"
      - name: Build installable debug APK
        script: |
          set -euo pipefail
          cd android/PurooPulai
          gradle --no-daemon :app:assembleDebug
          ls -lh app/build/outputs/apk/debug/app-debug.apk
    artifacts:
      - android/PurooPulai/app/build/outputs/apk/debug/app-debug.apk
      - android/PurooPulai/app/build/reports/**
  ios-debug-build:
    name: iOS Debug Build
    max_build_duration: 60
    environment:
      xcode: latest
      vars:
        XCODE_PROJECT: "PurooScopeCam.xcodeproj"
        XCODE_SCHEME: "PurooScopeCam"
    scripts:
      - name: Show Xcode version
        script: xcodebuild -version
      - name: Resolve package dependencies
        script: |
          xcodebuild -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -resolvePackageDependencies
      - name: Build unsigned simulator app
        script: |
          xcodebuild build \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -destination "generic/platform=iOS Simulator" \
            CODE_SIGNING_ALLOWED=NO
    artifacts:
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/Products/**/*.app
      - $HOME/Library/Developer/Xcode/DerivedData/**/Logs/Build/*.xcactivitylog
  ios-unsigned-ipa:
    name: iOS Unsigned IPA
    max_build_duration: 60
    environment:
      xcode: latest
      vars:
        XCODE_PROJECT: "PurooScopeCam.xcodeproj"
        XCODE_SCHEME: "PurooScopeCam"
    scripts:
      - name: Show Xcode version
        script: xcodebuild -version
      - name: Test camera geometry and layout
        script: |
          set -euo pipefail
          mkdir -p build
          swiftc PurooScopeCam/Models/CameraGeometry.swift Tests/CameraGeometryTests/main.swift -o build/camera-geometry-tests
          build/camera-geometry-tests
      - name: Test small-motion fusion and high-frequency fallback
        script: |
          set -euo pipefail
          git show 5f18627:PurooScopeCam/Services/FrameStabilizationEngine.swift > build/build36-engine.swift
          bash Tests/MotionFusionTests/run.sh build/build36-engine.swift --characterize > build/build36-regressions.log
          cat build/build36-regressions.log
          bash Tests/MotionFusionTests/run.sh
      - name: Test zoom mapping, gestures and request coalescing
        script: |
          set -euo pipefail
          swiftc PurooScopeCam/Models/CameraZoom.swift Tests/CameraZoomTests/main.swift -o build/camera-zoom-tests
          build/camera-zoom-tests
      - name: Test exposure, presentation metrics and shadow FFT
        script: |
          set -euo pipefail
          swiftc -O PurooScopeCam/Models/StabilizationDiagnostics.swift PurooScopeCam/Services/PhaseCorrelationEstimator.swift Tests/StabilizationDiagnosticsTests/main.swift -o build/stabilization-diagnostics-tests
          build/stabilization-diagnostics-tests
      - name: Test production visual measurements and IMU projection
        script: |
          set -euo pipefail
          bash Tests/MeasurementTests/run.sh
      - name: Build unsigned iPhoneOS app
        script: |
          set -euo pipefail
          xcodebuild build \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath "$CM_BUILD_DIR/build/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO
      - name: Test production recorder with synthetic video and audio
        script: |
          set -euo pipefail
          {
            printf 'import Foundation\nimport AVFoundation\nimport CoreImage\n'
            awk '/^private final class StabilizedPreviewRecorder / {copy=1} /^struct CameraPreviewView:/ {copy=0} copy' PurooScopeCam/Views/CameraPreviewView.swift
            cat Tests/RecorderTests/main.swift
          } > build/main.swift
          swiftc -swift-version 5 PurooScopeCam/Models/CameraGeometry.swift build/main.swift -o build/recorder-tests
          build/recorder-tests
      - name: Package unsigned IPA artifact
        script: |
          set -euo pipefail
          IPA_PATH="$CM_BUILD_DIR/build/PurooScopeCam-unsigned.ipa"
          APP_PATH=$(find "$CM_BUILD_DIR/build/DerivedData/Build/Products/Release-iphoneos" \
            -maxdepth 1 \
            -name "*.app" \
            -type d \
            | head -n 1)

          if [ -z "$APP_PATH" ]; then
            echo "No .app product found"
            exit 1
          fi

          rm -rf "$CM_BUILD_DIR/build/ipa"
          mkdir -p "$CM_BUILD_DIR/build/ipa/Payload"
          ditto "$APP_PATH" "$CM_BUILD_DIR/build/ipa/Payload/$(basename "$APP_PATH")"
          cd "$CM_BUILD_DIR/build/ipa"
          zip -qry "$IPA_PATH" Payload
          ls -lh "$IPA_PATH"
    artifacts:
      - build/PurooScopeCam-unsigned.ipa
      - build/DerivedData/**/Logs/Build/*.xcactivitylog
