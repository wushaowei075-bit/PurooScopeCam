workflows:
  android-debug-apk:
    name: Android Debug APK
    max_build_duration: 60
    environment:
      java: 17
    scripts:
      - name: Show Android build environment
        script: |
          java -version
          gradle --version
          echo "ANDROID_HOME=$ANDROID_HOME"
      - name: Build installable debug APK
        script: |
          set -euo pipefail
          cd android/PurooPulai
          gradle --no-daemon :app:assembleDebug
          ls -lh app/build/outputs/apk/debug/app-debug.apk
    artifacts:
      - android/PurooPulai/app/build/outputs/apk/debug/app-debug.apk
      - android/PurooPulai/app/build/reports/**
  ios-debug-build:
    name: iOS Debug Build
    max_build_duration: 60
    environment:
      xcode: latest
      vars:
        XCODE_PROJECT: "PurooScopeCam.xcodeproj"
        XCODE_SCHEME: "PurooScopeCam"
    scripts:
      - name: Show Xcode version
        script: xcodebuild -version
      - name: Resolve package dependencies
        script: |
          xcodebuild -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -resolvePackageDependencies
      - name: Build unsigned simulator app
        script: |
          xcodebuild build \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -destination "generic/platform=iOS Simulator" \
            CODE_SIGNING_ALLOWED=NO
    artifacts:
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/Products/**/*.app
      - $HOME/Library/Developer/Xcode/DerivedData/**/Logs/Build/*.xcactivitylog
  ios-unsigned-ipa:
    name: iOS Unsigned IPA
    max_build_duration: 60
    environment:
      xcode: latest
      vars:
        XCODE_PROJECT: "PurooScopeCam.xcodeproj"
        XCODE_SCHEME: "PurooScopeCam"
    scripts:
      - name: Show Xcode version
        script: xcodebuild -version
      - name: Test camera geometry and layout
        script: |
          set -euo pipefail
          mkdir -p build
          swiftc PurooScopeCam/Models/CameraGeometry.swift Tests/CameraGeometryTests/main.swift -o build/camera-geometry-tests
          build/camera-geometry-tests
      - name: Test small-motion fusion and high-frequency fallback
        script: |
          set -euo pipefail
          git show 59f2fb2:PurooScopeCam/Services/FrameStabilizationEngine.swift > build/build37-engine.swift
          bash Tests/MotionFusionTests/run.sh build/build37-engine.swift --characterize > build/build37-regressions.log
          cat build/build37-regressions.log
          bash Tests/MotionFusionTests/run.sh
      - name: Test zoom mapping, gestures and request coalescing
        script: |
          set -euo pipefail
          swiftc PurooScopeCam/Models/CameraZoom.swift Tests/CameraZoomTests/main.swift -o build/camera-zoom-tests
          build/camera-zoom-tests
      - name: Test exposure, presentation metrics and shadow FFT
        script: |
          set -euo pipefail
          swiftc -O PurooScopeCam/Models/StabilizationDiagnostics.swift PurooScopeCam/Services/PhaseCorrelationEstimator.swift Tests/StabilizationDiagnosticsTests/main.swift -o build/stabilization-diagnostics-tests
          build/stabilization-diagnostics-tests
      - name: Test production visual measurements and IMU projection
        script: |
          set -euo pipefail
          bash Tests/MeasurementTests/run.sh
      - name: Build unsigned iPhoneOS app
        script: |
          set -euo pipefail
          xcodebuild build \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath "$CM_BUILD_DIR/build/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO
      - name: Test production recorder with synthetic video and audio
        script: |
          set -euo pipefail
          {
            printf 'import Foundation\nimport AVFoundation\nimport CoreImage\n'
            awk '/^private final class StabilizedPreviewRecorder / {copy=1} /^struct CameraPreviewView:/ {copy=0} copy' PurooScopeCam/Views/CameraPreviewView.swift
            cat Tests/RecorderTests/main.swift
          } > build/main.swift
          swiftc -swift-version 5 PurooScopeCam/Models/CameraGeometry.swift build/main.swift -o build/recorder-tests
          build/recorder-tests
      - name: Package unsigned IPA artifact
        script: |
          set -euo pipefail
          IPA_PATH="$CM_BUILD_DIR/build/PurooScopeCam-unsigned.ipa"
          APP_PATH=$(find "$CM_BUILD_DIR/build/DerivedData/Build/Products/Release-iphoneos" \
            -maxdepth 1 \
            -name "*.app" \
            -type d \
            | head -n 1)

          if [ -z "$APP_PATH" ]; then
            echo "No .app product found"
            exit 1
          fi

          rm -rf "$CM_BUILD_DIR/build/ipa"
          mkdir -p "$CM_BUILD_DIR/build/ipa/Payload"
          ditto "$APP_PATH" "$CM_BUILD_DIR/build/ipa/Payload/$(basename "$APP_PATH")"
          cd "$CM_BUILD_DIR/build/ipa"
          zip -qry "$IPA_PATH" Payload
          ls -lh "$IPA_PATH"
    artifacts:
      - build/PurooScopeCam-unsigned.ipa
      - build/DerivedData/**/Logs/Build/*.xcactivitylog
  ios-app-store:
    name: iOS App Store Connect Upload
    max_build_duration: 60
    integrations:
      app_store_connect: Puroo App Store Connect
    environment:
      xcode: latest
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.puroo.scopecam
      vars:
        XCODE_PROJECT: PurooScopeCam.xcodeproj
        XCODE_SCHEME: PurooScopeCam
        APP_STORE_APPLE_ID: "6834332510"
        APP_STORE_VERSION: "1.0"
        APPLE_TEAM_ID: TU73WVSUL5
        IOS_BUNDLE_ID: com.puroo.scopecam
        MINIMUM_BUILD_NUMBER: "39"
    scripts:
      - name: Determine the next available App Store build number
        script: |
          #!/usr/bin/env bash
          set -euo pipefail
          xcodebuild -version
          latest_build=$(app-store-connect get-latest-build-number \
            --platform IOS --version-string "$APP_STORE_VERSION" "$APP_STORE_APPLE_ID")
          build_number="$MINIMUM_BUILD_NUMBER"
          case "$latest_build" in
            ''|None) ;;
            *[!0-9]*)
              echo 'App Store Connect returned an unexpected build number.' >&2
              exit 1
              ;;
            *)
              next_build=$((10#$latest_build + 1))
              if (( next_build > build_number )); then
                build_number="$next_build"
              fi
              ;;
          esac
          echo "IOS_BUILD_NUMBER=$build_number" >> "$CM_ENV"
          echo "Building iOS $APP_STORE_VERSION ($build_number)"
      - name: Apply the App Store provisioning profile
        script: |
          #!/usr/bin/env bash
          set -euo pipefail
          xcode-project use-profiles --project "$XCODE_PROJECT" --archive-method app-store \
            --custom-export-options '{"manageAppVersionAndBuildNumber": false}'
      - name: Archive and export signed iOS IPA
        script: |
          #!/usr/bin/env bash
          set -euo pipefail
          xcode-project build-ipa --project "$XCODE_PROJECT" --scheme "$XCODE_SCHEME" \
            --config Release \
            --archive-xcargs "DEVELOPMENT_TEAM=$APPLE_TEAM_ID MARKETING_VERSION=$APP_STORE_VERSION CURRENT_PROJECT_VERSION=$IOS_BUILD_NUMBER"
      - name: Verify the exported app and signature before upload
        script: |
          #!/usr/bin/env bash
          set -euo pipefail
          packages=(build/ios/ipa/*.ipa)
          if [[ ${#packages[@]} -ne 1 || ! -f ${packages[0]} ]]; then
            echo 'Expected exactly one exported IPA.' >&2
            exit 1
          fi
          verification_dir=$(mktemp -d)
          trap 'rm -rf -- "$verification_dir"' EXIT
          ditto -x -k "${packages[0]}" "$verification_dir"
          app="$verification_dir/Payload/$XCODE_SCHEME.app"
          codesign --verify --strict "$app"
          python3 - "$app" <<'PY'
          import os
          import plistlib
          import subprocess
          import sys
          from pathlib import Path

          app = Path(sys.argv[1])
          info = plistlib.loads((app / "Info.plist").read_bytes())
          expected = {
              "CFBundleIdentifier": os.environ["IOS_BUNDLE_ID"],
              "CFBundleShortVersionString": os.environ["APP_STORE_VERSION"],
              "CFBundleVersion": os.environ["IOS_BUILD_NUMBER"],
          }
          for field, value in expected.items():
              if info.get(field) != value:
                  sys.exit(f"Exported app has an unexpected {field}.")

          profile = plistlib.loads(subprocess.check_output([
              "security", "cms", "-D", "-i", str(app / "embedded.mobileprovision"),
          ]))
          team = os.environ["APPLE_TEAM_ID"]
          entitlements = profile.get("Entitlements", {})
          expected_application_id = f'{team}.{expected["CFBundleIdentifier"]}'
          if (profile.get("TeamIdentifier") != [team]
                  or entitlements.get("application-identifier") != expected_application_id
                  or entitlements.get("get-task-allow") is not False
                  or profile.get("ProvisionedDevices") or profile.get("ProvisionsAllDevices")):
              sys.exit("The exported app lacks the expected App Store provisioning profile.")

          plistlib.loads((app / "PrivacyInfo.xcprivacy").read_bytes())
          print("Exported IPA signature, provisioning profile, version and privacy manifest verified.")
          PY
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: false
        submit_to_app_store: false
